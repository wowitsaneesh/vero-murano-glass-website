{% extends "base.html" %}

{% block content %}
    <main class="auth-page">
        <div class="container">
            <div class="auth-card">
                <p class="eyebrow-text">Create account</p>

                <h1>Join Vero Murano Glass</h1>

                <p class="auth-intro">
                    Create an account to make future order enquiries easier.
                </p>

                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Create a password">
                    </div>

                    <button type="submit" class="btn btn-dark auth-button">
                        Create Account
                    </button>
                </form>

                <p class="auth-switch-text">
                    Already have an account?
                    <a href="{{ url_for('login') }}">Login here</a>
                </p>
            </div>
        </div>
    </main>
{% endblock %}
