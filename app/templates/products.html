{% extends "base.html" %}

{% block content %}
    <main class="page-section">
        <h1>Products</h1>
        <p>Browse our handcrafted Murano-inspired jewellery and glass accessories.</p>

        <div class="product-grid">
            {% for product in products %}
                <div class="product-card">
                    <div class="product-image-placeholder"></div>

                    <h2>{{ product.name }}</h2>
                    <p>{{ product.category }}</p>
                    <p>${{ "%.2f"|format(product.price) }}</p>

                    <a href="{{ url_for('product_detail', product_id=product.id) }}" class="product-link">View Details</a>
                </div>
            {% endfor %}
        </div>
    </main>
{% endblock %}
